apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      valuesObject:
        controllers:
          media:
            enabled: true
            type: statefulset
            replicas: 0
            containers:
              dummy:
                image:
                  repository: nginx
                  tag: latest
        service:
          truenas:
            controller: media
            ports:
              jellyfin: 
                port: 30013
        route:
          jellyfin:
            enabled: true
            hostnames:
              - jellyfin2.vcov.org
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: media
                  port: 30013
        # ingress:
        #   media:
        #     hosts:
        #       - host: jellyfin2.vcov.org
        #         paths:
        #           - path: /
        #             pathType: Prefix
        #             service:
        #               identifier: truenas
        #               port: 30013
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  namespace: media
  labels:
    kubernetes.io/service-name: media
addressType: IPv4
ports:
  - name: jellyfin
    port: 30013
endpoints:
  - addresses:
    - 192.168.1.10