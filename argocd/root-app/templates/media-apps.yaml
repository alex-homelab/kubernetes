apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      valuesObject:
        controllers:
          media:
            enabled: true
            type: statefulset
            replicas: 0
            containers:
              dummy:
                image:
                  repository: nginx
                  tag: latest
        service:
          truenas:
            controller: media
            type: ExternalName
            externalName: truenas.lan
        # route:
        #   jellyfin:
        #     enabled: true
        #     hostnames:
        #       - jellyfin2.vcov.org
        #     parentRefs:
        #       - name: traefik-gateway
        #         namespace: traefik
        #     rules: 
        #     -  backendRefs:
        #         - name: media
        #           port: 30013
        ingress:
          truenas:
            hosts:
              - host: jellyfin2.vcov.org
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: truenas
                      port: 30013
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
