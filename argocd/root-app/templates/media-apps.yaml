apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      valuesObject:
        serviceAccount:
          default:
            enabled: true
        rbac:
          roles:
            manage-endpointslices:
              forceRename: manage-endpointslices
              type: Role
              rules:
                - apiGroups: ["discovery.k8s.io"]
                  resources: ["endpointslices"]
                  verbs: ["get", "list", "create", "update", "patch"]
          bindings:
            manage-endpointslices-binding:
              forceRename: allow-job-to-manage-endpointslices
              type: RoleBinding
              roleRef:
                identifier: manage-endpointslices
              subjects:
                - identifier: default
        controllers:
          endpoint-config:
            enabled: true
            type: job
            job:
              backoffLimit: 1
            serviceAccount:
              identifier: default
            containers:
              main:
                image:
                  repository: alpine/kubectl
                  tag: 1.35.0
                command:
                  - /bin/sh
                  - -c
                  - |
                    cat <<'EOF' | kubectl apply -f -
                    apiVersion: discovery.k8s.io/v1
                    kind: EndpointSlice
                    metadata:
                      name: truenas
                      namespace: media
                      labels:
                        kubernetes.io/service-name: media
                      annotations:
                        argocd.argoproj.io/hook: Sync
                        argocd.argoproj.io/hook-delete-policy: HookSucceeded
                    addressType: IPv4
                    ports:
                      - name: jellyfin
                        protocol: TCP
                        port: 30013
                    endpoints:
                      - conditions:
                          ready: true
                        addresses:
                        - 192.168.1.10
                    EOF
        service:
          truenas:
            controller: endpoint-config
            ports:
              jellyfin: 
                port: 30013
              sonarr: 
                port: 30113
              radarr:
                port: 30025
              prowlarr:
                port: 30050
              qb:
                port: 30024
        route:
          jellyfin:
            enabled: true
            hostnames:
              - jellyfin2.vcov.org
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: media
                  port: 30013
          sonarr:
            enabled: true
            hostnames:
              - sonarr2.vcov.org
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: media
                  port: 30113
          radarr:
            enabled: true
            hostnames:
              - radarr2.vcov.org
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: media
                  port: 30025
          prowlarr:
            enabled: true
            hostnames:
              - prowlarr2.vcov.org
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: media
                  port: 30050
          qb:
            enabled: true
            hostnames:
              - qb2.vcov.org
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: media
                  port: 30024
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true