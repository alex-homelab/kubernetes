apiVersion: v1
kind: Namespace
metadata:
  name: context-forge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: context-forge
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/IBM/mcp-context-forge.git
    targetRevision: v1.0.6
    path: charts/mcp-stack
    helm:
      releaseName: context-forge
      valuesObject:
        networkPolicies:
          enabled: false

        mcpContextForge:
          pluginConfig:
            enabled: true
            plugins: |
              plugin_dirs:
                - "plugins/native"
                - "plugins/custom"
                - "/etc/mcpgateway/plugins"

              plugin_settings:
                parallel_execution_within_band: true
                plugin_timeout: 120
                fail_on_plugin_error: false
                enable_plugin_api: true
                plugin_health_check_interval: 120
                include_user_info: false

              plugins:
                - name: "ToolsTelemetryExporter"
                  kind: "plugins.tools_telemetry_exporter.telemetry_exporter.ToolsTelemetryExporterPlugin"
                  description: "Export comprehensive tool invocation telemetry to OpenTelemetry"
                  version: "0.1.0"
                  author: "Bar Haim"
                  hooks: ["tool_pre_invoke", "tool_post_invoke"]
                  tags: ["telemetry", "observability", "opentelemetry", "monitoring"]
                  mode: "permissive"
                  priority: 200
                  conditions: []
                  config:
                    export_full_payload: false
                    max_payload_bytes_size: 10000
          replicaCount: 1
          hpa:
            enabled: false
          image:
            tag: v1.0.6
            pullPolicy: IfNotPresent
          config:
            AUTH_REQUIRED: "false"
            MCP_REQUIRE_AUTH: "false"
            REQUIRE_STRONG_SECRETS: "false"
          ingress:
            enabled: false
          metrics:
            serviceMonitor:
              enabled: false
          secret:
            TOKEN_EXPIRY: "1440"
          extraEnv:
            - name: CSRF_ENABLED
              value: "false"
            - name: OTEL_ENABLE_OBSERVABILITY
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_SERVICE_NAME
              value: "context-forge"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://phoenix-svc.phoenix.svc.cluster.local:6006"
            - name: STRUCTURED_LOGGING_DATABASE_ENABLED
              value: "true"
            - name: METRICS_AGGREGATION_AUTO_START
              value: "true"
            - name: OBSERVABILITY_ENABLED
              value: "true"
            - name: OBSERVABILITY_TRACE_HTTP_REQUESTS
              value: "true"
            - name: OBSERVABILITY_EVENTS_ENABLED
              value: "true"
            - name: OBSERVABILITY_METRICS_ENABLED
              value: "true"
            - name: OBSERVABILITY_TRACE_RETENTION_DAYS
              value: "7"
            - name: OBSERVABILITY_MAX_TRACES
              value: "100000"
            - name: OBSERVABILITY_SAMPLE_RATE
              value: "1.0"
            - name: OBSERVABILITY_INCLUDE_PATHS
              value: '["^/rpc/?$","^/sse$","^/message$","^/mcp(?:/|$)","^/servers/[^/]+/mcp/?$","^/servers/[^/]+/sse$","^/servers/[^/]+/message$","^/a2a(?:/|$)"]'
            - name: OBSERVABILITY_EXCLUDE_PATHS
              value: '["/health","/healthz","/ready","/metrics","/static/.*"]'
          # Keep chart default gateway secret and overlay sensitive keys
          # from Infisical via extraEnvFrom (last source wins).
          extraEnvFrom:
            - secretRef:
                name: context-forge-gateway-secret

        migration:
          enabled: false

        mcpFastTimeServer:
          ingress:
            enabled: false

        postgres:
          external:
            enabled: true
            existingSecret: context-forge-postgres

        redis:
          enabled: true
          auth:
            enabled: true
            existingSecret: context-forge-mcp-stack-redis-secret
          persistence:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: context-forge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: context-forge-db
  namespace: db
spec:
  name: contextforge
  owner: contextforge
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-password

  data:
    - secretKey: username
      remoteRef:
        key: /context-forge/PG_USER
    - secretKey: password
      remoteRef:
        key: /context-forge/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-postgres
  namespace: context-forge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-postgres

  data:
    - secretKey: host
      remoteRef:
        key: /context-forge/DB_HOST
    - secretKey: port
      remoteRef:
        key: /context-forge/DB_PORT
    - secretKey: dbname
      remoteRef:
        key: /context-forge/DB_NAME
    - secretKey: user
      remoteRef:
        key: /context-forge/PG_USER
    - secretKey: password
      remoteRef:
        key: /context-forge/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-gateway
  namespace: context-forge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-gateway-secret
    template:
      mergePolicy: Merge
      data:
        PLUGINS_ENABLED: "true"
        SSO_API_TOKEN_AUTH_ENABLED: "true"

  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: /context-forge/JWT_SECRET_KEY
    - secretKey: AUTH_ENCRYPTION_SECRET
      remoteRef:
        key: /context-forge/AUTH_ENCRYPTION_SECRET
    - secretKey: PLATFORM_ADMIN_EMAIL
      remoteRef:
        key: /context-forge/PLATFORM_ADMIN_EMAIL
    - secretKey: PLATFORM_ADMIN_PASSWORD
      remoteRef:
        key: /context-forge/PLATFORM_ADMIN_PASSWORD
    - secretKey: DEFAULT_USER_PASSWORD
      remoteRef:
        key: /context-forge/DEFAULT_USER_PASSWORD
    - secretKey: APP_DOMAIN
      remoteRef:
        key: /context-forge/APP_DOMAIN
    - secretKey: SSO_ENABLED
      remoteRef:
        key: /context-forge/SSO_ENABLED
    - secretKey: SSO_KEYCLOAK_ENABLED
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_ENABLED
    - secretKey: SSO_KEYCLOAK_BASE_URL
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_BASE_URL
    - secretKey: SSO_KEYCLOAK_REALM
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_REALM
    - secretKey: SSO_KEYCLOAK_CLIENT_ID
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_CLIENT_ID
    - secretKey: SSO_KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_CLIENT_SECRET
    - secretKey: OTEL_EXPORTER_OTLP_HEADERS
      remoteRef:
        key: /context-forge/OTEL_EXPORTER_OTLP_HEADERS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-redis
  namespace: context-forge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-mcp-stack-redis-secret

  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /context-forge/REDIS_PASSWORD
