apiVersion: v1
kind: Namespace
metadata:
  name: context-forge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: context-forge
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/IBM/mcp-context-forge.git
    targetRevision: v1.0.9
    path: charts/mcp-stack
    helm:
      releaseName: context-forge
      valuesObject:
        networkPolicies:
          enabled: false

        mcpContextForge:
          pluginConfig:
            enabled: true
            plugins: |
              plugin_dirs:
                - "plugins/native"
                - "plugins/custom"
                - "/etc/mcpgateway/plugins"

              plugin_settings:
                parallel_execution_within_band: true
                plugin_timeout: 120
                fail_on_plugin_error: false
                enable_plugin_api: true
                plugin_health_check_interval: 120
                include_user_info: false

              plugins:
                - name: "ToolsTelemetryExporter"
                  kind: "plugins.tools_telemetry_exporter.telemetry_exporter.ToolsTelemetryExporterPlugin"
                  description: "Export comprehensive tool invocation telemetry to OpenTelemetry"
                  version: "0.1.0"
                  author: "Bar Haim"
                  hooks: ["tool_pre_invoke", "tool_post_invoke"]
                  tags: ["telemetry", "observability", "opentelemetry", "monitoring"]
                  mode: "permissive"
                  priority: 200
                  conditions: []
                  config:
                    export_full_payload: false
                    max_payload_bytes_size: 10000
          replicaCount: 3
          hpa:
            enabled: false
          image:
            tag: v1.0.9
            pullPolicy: IfNotPresent
          config:
            ALLOWED_ORIGINS: '["https://mcpgw.vcov.org"]'
            APP_DOMAIN: "https://mcpgw.vcov.org"
            GUNICORN_MAX_REQUESTS: "2000"
            GUNICORN_MAX_REQUESTS_JITTER: "200"
            MCPGATEWAY_SESSION_AFFINITY_ENABLED: "true"
            METRICS_CUSTOM_LABELS: "release: kube-prom"
            METRICS_NAMESPACE: "monitoring"
            SSRF_ALLOW_PRIVATE_NETWORKS: "true"
            USE_STATEFUL_SESSIONS: "true"
          ingress:
            enabled: false
          metrics:
            serviceMonitor:
              enabled: false
          secret:
            TOKEN_EXPIRY: "1440"
          extraEnv:
            - name: CSRF_ENABLED
              value: "false"
            - name: OTEL_ENABLE_OBSERVABILITY
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_SERVICE_NAME
              value: "context-forge"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "openinference.project.name=context-forge"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_CAPTURE_IDENTITY_ATTRIBUTES
              value: "true"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://phoenix-svc.phoenix.svc.cluster.local:6006/v1/traces"
            - name: STRUCTURED_LOGGING_DATABASE_ENABLED
              value: "true"
            - name: METRICS_AGGREGATION_AUTO_START
              value: "true"
            - name: OBSERVABILITY_ENABLED
              value: "true"
            - name: OBSERVABILITY_TRACE_HTTP_REQUESTS
              value: "true"
            - name: OBSERVABILITY_EVENTS_ENABLED
              value: "true"
            - name: OBSERVABILITY_METRICS_ENABLED
              value: "true"
            - name: OBSERVABILITY_TRACE_RETENTION_DAYS
              value: "7"
            - name: OBSERVABILITY_MAX_TRACES
              value: "100000"
            - name: OBSERVABILITY_SAMPLE_RATE
              value: "1.0"
            - name: OBSERVABILITY_INCLUDE_PATHS
              value: '["^/rpc/?$","^/sse$","^/message$","^/mcp(?:/|$)","^/servers/[^/]+/mcp/?$","^/servers/[^/]+/sse$","^/servers/[^/]+/message$","^/a2a(?:/|$)"]'
            - name: OBSERVABILITY_EXCLUDE_PATHS
              value: '["/health","/healthz","/ready","/metrics","/static/.*"]'
          # Keep chart default gateway secret and overlay sensitive keys
          # from Infisical via extraEnvFrom (last source wins).
          extraEnvFrom:
            - secretRef:
                name: context-forge-gateway-secret

        migration:
          enabled: false

        mcpFastTimeServer:
          ingress:
            enabled: false

        postgres:
          external:
            enabled: true
            existingSecret: context-forge-postgres

        redis:
          enabled: true
          auth:
            enabled: true
            existingSecret: context-forge-mcp-stack-redis-secret
          persistence:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: context-forge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: context-forge-db
  namespace: db
spec:
  name: contextforge
  owner: contextforge
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-password

  data:
    - secretKey: username
      remoteRef:
        key: /context-forge/PG_USER
    - secretKey: password
      remoteRef:
        key: /context-forge/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-postgres
  namespace: context-forge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-postgres

  data:
    - secretKey: host
      remoteRef:
        key: /context-forge/DB_HOST
    - secretKey: port
      remoteRef:
        key: /context-forge/DB_PORT
    - secretKey: dbname
      remoteRef:
        key: /context-forge/DB_NAME
    - secretKey: user
      remoteRef:
        key: /context-forge/PG_USER
    - secretKey: password
      remoteRef:
        key: /context-forge/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-gateway
  namespace: context-forge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-gateway-secret
    template:
      mergePolicy: Merge
      data:
        ACCOUNT_LOCKOUT_DURATION_MINUTES: "30"
        ACCOUNT_LOCKOUT_NOTIFICATION_ENABLED: "true"
        ADMIN_REQUIRE_PASSWORD_CHANGE_ON_BOOTSTRAP: "false"
        ALLOW_TEAM_CREATION: "true"
        ALLOW_TEAM_INVITATIONS: "true"
        ALLOW_TEAM_JOIN_REQUESTS: "true"
        ALLOW_UNAUTHENTICATED_ADMIN: "false"
        API_ALLOW_BASIC_AUTH: "false"
        ARGON2ID_MEMORY_COST: "65536"
        ARGON2ID_PARALLELISM: "1"
        ARGON2ID_TIME_COST: "3"
        AUTH_REQUIRED: "true"
        AUTO_CREATE_PERSONAL_TEAMS: "true"
        DCR_ALLOWED_ISSUERS: "[]"
        DCR_AUTO_REGISTER_ON_MISSING_CREDENTIALS: "true"
        DCR_CLIENT_NAME_TEMPLATE: "ContextForge ({gateway_name})"
        DCR_DEFAULT_SCOPES: '["mcp:read"]'
        DCR_ENABLED: "true"
        DCR_METADATA_CACHE_TTL: "3600"
        DCR_REQUEST_REFRESH_TOKEN_WHEN_UNSUPPORTED: "false"
        DCR_TOKEN_ENDPOINT_AUTH_METHOD: "client_secret_basic"
        DEFAULT_ADMIN_ROLE: "platform_admin"
        DEFAULT_TEAM_MEMBER_ROLE: "viewer"
        DEFAULT_TEAM_OWNER_ROLE: "team_admin"
        DEFAULT_USER_ROLE: "platform_viewer"
        DETECT_DEFAULT_PASSWORD_ON_LOGIN: "true"
        DOCS_ALLOW_BASIC_AUTH: "false"
        EMAIL_AUTH_ENABLED: "true"
        EMBED_ENVIRONMENT_IN_TOKENS: "false"
        ENABLE_ED25519_SIGNING: "false"
        FAILED_LOGIN_MIN_RESPONSE_MS: "250"
        INVITATION_EXPIRY_DAYS: "7"
        JWT_AUDIENCE_VERIFICATION: "true"
        JWT_ISSUER_VERIFICATION: "true"
        MAX_FAILED_LOGIN_ATTEMPTS: "5"
        MAX_MEMBERS_PER_TEAM: "100"
        MAX_TEAMS_PER_USER: "50"
        MCP_CLIENT_AUTH_ENABLED: "true"
        MCP_REQUIRE_AUTH: "true"
        MCPGATEWAY_BOOTSTRAP_ROLES_IN_DB_ENABLED: "false"
        MIN_PASSWORD_LENGTH: "12"
        MIN_SECRET_LENGTH: "32"
        OAUTH_DISCOVERY_ENABLED: "true"
        OAUTH_MAX_RETRIES: "3"
        OAUTH_PREFERRED_CODE_CHALLENGE_METHOD: "S256"
        OAUTH_REQUEST_TIMEOUT: "30"
        PASSWORD_CHANGE_ENFORCEMENT_ENABLED: "true"
        PASSWORD_MAX_AGE_DAYS: "90"
        PASSWORD_MIN_LENGTH: "8"
        PASSWORD_POLICY_ENABLED: "true"
        PASSWORD_PREVENT_REUSE: "true"
        PASSWORD_REQUIRE_LOWERCASE: "true"
        PASSWORD_REQUIRE_NUMBERS: "false"
        PASSWORD_REQUIRE_SPECIAL: "true"
        PASSWORD_REQUIRE_UPPERCASE: "true"
        PASSWORD_RESET_ENABLED: "true"
        PASSWORD_RESET_INVALIDATE_SESSIONS: "true"
        PASSWORD_RESET_MIN_RESPONSE_MS: "250"
        PASSWORD_RESET_RATE_LIMIT: "5"
        PASSWORD_RESET_RATE_WINDOW_MINUTES: "15"
        PASSWORD_RESET_TOKEN_EXPIRY_MINUTES: "60"
        PLUGINS_ENABLED: "true"
        PROTECT_ALL_ADMINS: "true"
        PUBLIC_REGISTRATION_ENABLED: "false"
        REQUIRE_EMAIL_VERIFICATION_FOR_INVITES: "true"
        REQUIRE_JTI: "true"
        REQUIRE_PASSWORD_CHANGE_FOR_DEFAULT_PASSWORD: "true"
        REQUIRE_STRONG_SECRETS: "true"
        REQUIRE_TOKEN_EXPIRATION: "true"
        REQUIRE_USER_IN_DB: "true"
        SMTP_ENABLED: "false"
        SSO_ADFS_ENABLED: "false"
        SSO_API_TOKEN_AUTH_ENABLED: "true"
        SSO_AUTO_CREATE_USERS: "true"
        SSO_ENTRA_ENABLED: "false"
        SSO_GITHUB_ENABLED: "false"
        SSO_GOOGLE_ENABLED: "false"
        SSO_IBM_VERIFY_ENABLED: "false"
        SSO_OKTA_ENABLED: "false"
        SSO_PRESERVE_ADMIN_AUTH: "false"
        TOKEN_EXPIRY: "1440"
        TOKEN_LAST_USED_UPDATE_INTERVAL_MINUTES: "5"
        TOKEN_USAGE_LOGGING_ENABLED: "true"
        TRUST_PROXY_AUTH: "false"
        TRUST_PROXY_AUTH_DANGEROUSLY: "false"
        VALIDATE_TOKEN_ENVIRONMENT: "false"

  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: /context-forge/JWT_SECRET_KEY
    - secretKey: AUTH_ENCRYPTION_SECRET
      remoteRef:
        key: /context-forge/AUTH_ENCRYPTION_SECRET
    - secretKey: PLATFORM_ADMIN_EMAIL
      remoteRef:
        key: /context-forge/PLATFORM_ADMIN_EMAIL
    - secretKey: PLATFORM_ADMIN_PASSWORD
      remoteRef:
        key: /context-forge/PLATFORM_ADMIN_PASSWORD
    - secretKey: DEFAULT_USER_PASSWORD
      remoteRef:
        key: /context-forge/DEFAULT_USER_PASSWORD
    - secretKey: APP_DOMAIN
      remoteRef:
        key: /context-forge/APP_DOMAIN
    - secretKey: SSO_ENABLED
      remoteRef:
        key: /context-forge/SSO_ENABLED
    - secretKey: SSO_KEYCLOAK_ENABLED
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_ENABLED
    - secretKey: SSO_KEYCLOAK_BASE_URL
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_BASE_URL
    - secretKey: SSO_KEYCLOAK_REALM
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_REALM
    - secretKey: SSO_KEYCLOAK_CLIENT_ID
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_CLIENT_ID
    - secretKey: SSO_KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: /context-forge/SSO_KEYCLOAK_CLIENT_SECRET
    - secretKey: SSO_GENERIC_ENABLED
      remoteRef:
        key: /context-forge/SSO_GENERIC_ENABLED
    - secretKey: SSO_GENERIC_PROVIDER_ID
      remoteRef:
        key: /context-forge/SSO_GENERIC_PROVIDER_ID
    - secretKey: SSO_GENERIC_DISPLAY_NAME
      remoteRef:
        key: /context-forge/SSO_GENERIC_DISPLAY_NAME
    - secretKey: SSO_GENERIC_CLIENT_ID
      remoteRef:
        key: /context-forge/SSO_GENERIC_CLIENT_ID
    - secretKey: SSO_GENERIC_CLIENT_SECRET
      remoteRef:
        key: /context-forge/SSO_GENERIC_CLIENT_SECRET
    - secretKey: SSO_GENERIC_AUTHORIZATION_URL
      remoteRef:
        key: /context-forge/SSO_GENERIC_AUTHORIZATION_URL
    - secretKey: SSO_GENERIC_TOKEN_URL
      remoteRef:
        key: /context-forge/SSO_GENERIC_TOKEN_URL
    - secretKey: SSO_GENERIC_USERINFO_URL
      remoteRef:
        key: /context-forge/SSO_GENERIC_USERINFO_URL
    - secretKey: SSO_GENERIC_ISSUER
      remoteRef:
        key: /context-forge/SSO_GENERIC_ISSUER
    - secretKey: SSO_GENERIC_JWKS_URI
      remoteRef:
        key: /context-forge/SSO_GENERIC_JWKS_URI
    - secretKey: SSO_GENERIC_SCOPE
      remoteRef:
        key: /context-forge/SSO_GENERIC_SCOPE
    - secretKey: SSO_GENERIC_GROUPS_CLAIM
      remoteRef:
        key: /context-forge/SSO_GENERIC_GROUPS_CLAIM
    - secretKey: SSO_GENERIC_ADMIN_GROUPS
      remoteRef:
        key: /context-forge/SSO_GENERIC_ADMIN_GROUPS
    - secretKey: SSO_GENERIC_ROLE_MAPPINGS
      remoteRef:
        key: /context-forge/SSO_GENERIC_ROLE_MAPPINGS
    - secretKey: SSO_GENERIC_DEFAULT_ROLE
      remoteRef:
        key: /context-forge/SSO_GENERIC_DEFAULT_ROLE
    - secretKey: OTEL_EXPORTER_OTLP_HEADERS
      remoteRef:
        key: /context-forge/OTEL_EXPORTER_OTLP_HEADERS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-redis
  namespace: context-forge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: context-forge-mcp-stack-redis-secret

  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /context-forge/REDIS_PASSWORD
