apiVersion: v1
kind: Namespace
metadata:
  name: mcp-gateway-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-gateway-registry
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/agentic-community/mcp-gateway-registry.git
    targetRevision: v1.0.22-p1
    path: charts/mcp-gateway-registry-stack
    helm:
      releaseName: mcp-gateway-registry
      valuesObject:
        global:
          domain: mcp2.vcov.org
          existingSharedSecret: shared-secret
          existingOauthProviderSecret: oauth-provider-secret
          existingMongoCredentialsSecret: mongo-credentials
          ingress:
            tls: true
            routingMode: path

        registry:
          app:
            replicas: 1
          ingress:
            enabled: false

        auth-server:
          app:
            replicas: 1
          ingress:
            enabled: false

        mcpgw:
          app:
            replicas: 1
          ingress:
            enabled: false

        keycloak:
          create: false
          ingress:
            enabled: false

        keycloak-configure:
          enabled: true
          keycloak:
            # Reuse existing Keycloak realm in sso.vcov.org
            existingSecret: keycloak-configure-secret

        mongodb:
          enabled: true
          existingPasswordSecret: my-user-password

        mongodb-configure:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-gateway-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-registry-secrets
  namespace: mcp-gateway-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: shared-secret

  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: /mcp-gateway-registry/SECRET_KEY
    - secretKey: FEDERATION_STATIC_TOKEN
      remoteRef:
        key: /mcp-gateway-registry/FEDERATION_STATIC_TOKEN
    - secretKey: FEDERATION_ENCRYPTION_KEY
      remoteRef:
        key: /mcp-gateway-registry/FEDERATION_ENCRYPTION_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-registry-oauth-provider
  namespace: mcp-gateway-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: oauth-provider-secret

  data:
    - secretKey: AUTH_PROVIDER
      remoteRef:
        key: /mcp-gateway-registry/AUTH_PROVIDER
    - secretKey: KEYCLOAK_ENABLED
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_ENABLED
    - secretKey: KEYCLOAK_URL
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_URL
    - secretKey: KEYCLOAK_EXTERNAL_URL
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_EXTERNAL_URL
    - secretKey: KEYCLOAK_REALM
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_REALM
    - secretKey: KEYCLOAK_M2M_CLIENT_ID
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_M2M_CLIENT_ID
    - secretKey: KEYCLOAK_M2M_CLIENT_SECRET
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_M2M_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-registry-keycloak-config
  namespace: mcp-gateway-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: keycloak-configure-secret

  data:
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_ADMIN
    - secretKey: KEYCLOAK_ADMIN_URL
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_ADMIN_URL
    - secretKey: KEYCLOAK_URL
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_URL
    - secretKey: REALM
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_REALM
    - secretKey: AUTH_SERVER_EXTERNAL_URL
      remoteRef:
        key: /mcp-gateway-registry/AUTH_SERVER_EXTERNAL_URL
    - secretKey: REGISTRY_URL
      remoteRef:
        key: /mcp-gateway-registry/REGISTRY_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-registry-keycloak-admin-password
  namespace: mcp-gateway-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    # Required by keycloak-configure job env reference ({{ .Release.Name }}-keycloak)
    name: mcp-gateway-registry-keycloak

  data:
    - secretKey: admin-password
      remoteRef:
        key: /mcp-gateway-registry/KEYCLOAK_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-registry-mongo
  namespace: mcp-gateway-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: mongo-credentials

  data:
    - secretKey: DOCUMENTDB_DATABASE
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_DATABASE
    - secretKey: DOCUMENTDB_NAMESPACE
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_NAMESPACE
    - secretKey: DOCUMENTDB_USE_TLS
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_USE_TLS
    - secretKey: STORAGE_BACKEND
      remoteRef:
        key: /mcp-gateway-registry/STORAGE_BACKEND
    - secretKey: DOCUMENTDB_HOST
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_HOST
    - secretKey: DOCUMENTDB_PASSWORD
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_PASSWORD
    - secretKey: DOCUMENTDB_PORT
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_PORT
    - secretKey: DOCUMENTDB_REPLICA_SET
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_REPLICA_SET
    - secretKey: DOCUMENTDB_USERNAME
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_USERNAME
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-registry-mongodb-password
  namespace: mcp-gateway-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: my-user-password

  data:
    - secretKey: password
      remoteRef:
        key: /mcp-gateway-registry/DOCUMENTDB_PASSWORD
