apiVersion: v1
kind: Namespace
metadata:
  name: mcp-inspector
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-inspector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              app:
                image:
                  repository: ghcr.io/modelcontextprotocol/inspector
                  tag: "2.11.0"
                env:
                  MCP_INSPECTOR_SECRET_STORE: memory
                envFrom:
                  - secretRef:
                      name: mcp-inspector
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 6274
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /healthz
                        port: 6274
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 1Gi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
        service:
          app:
            controller: main
            ports:
              http:
                port: 6274
              sandbox:
                port: 6275
              apps:
                port: 6278
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-inspector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-inspector
  namespace: mcp-inspector
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mcp-inspector
  data:
    - secretKey: ALLOWED_ORIGINS
      remoteRef:
        key: /mcp-inspector/ALLOWED_ORIGINS
    - secretKey: MCP_SANDBOX_FULL_ADDRESS
      remoteRef:
        key: /mcp-inspector/MCP_SANDBOX_FULL_ADDRESS
    - secretKey: MCP_APP_ORIGIN_FULL_ADDRESS
      remoteRef:
        key: /mcp-inspector/MCP_APP_ORIGIN_FULL_ADDRESS
