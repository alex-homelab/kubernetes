apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metamcp
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://icoretech.github.io/helm
    chart: metamcp
    targetRevision: 0.3.2
    helm:
      releaseName: metamcp
      valuesObject:
        fullnameOverride: metamcp

        ingress:
          enabled: false
        gatewayAPI:
          enabled: false

        postgres:
          enabled: false

        env:
          APP_URL: "https://mcp.vcov.org"
          DATABASE_URL: "__set_via_secret__"
          POSTGRES_HOST: "postgres-rw.db.svc.cluster.local"
          PGHOST: "postgres-rw.db.svc.cluster.local"
          POSTGRES_PORT: "5432"
          PGPORT: "5432"

        auth:
          betterAuthSecret: ""

        extraEnvFrom:
          - secretRef:
              name: metamcp
        extraEnv:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: metamcp
                key: DATABASE_URL
  destination:
    server: https://kubernetes.default.svc
    namespace: metamcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: metamcp-db
  namespace: db
spec:
  name: metamcp
  owner: metamcp
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metamcp-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: metamcp-password

  data:
    - secretKey: username
      remoteRef:
        key: /metamcp/PG_USER
    - secretKey: password
      remoteRef:
        key: /metamcp/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metamcp
  namespace: metamcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: metamcp

  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: /metamcp/BETTER_AUTH_SECRET
    - secretKey: APP_URL
      remoteRef:
        key: /metamcp/APP_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: /metamcp/DATABASE_URL
