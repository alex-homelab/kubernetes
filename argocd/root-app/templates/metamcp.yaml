apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metamcp
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      releaseName: metamcp
      valuesObject:
        controllers:
          metamcp:
            strategy: RollingUpdate
            containers:
              app:
                image:
                  repository: ghcr.io/metatool-ai/metamcp
                  tag: 2.4.22
                  pullPolicy: IfNotPresent

                env:
                  KUBECONFIG: /etc/kubeconfig/config
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: metamcp
                        key: DATABASE_URL

                envFrom:
                  - secretRef:
                      name: metamcp

                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 12008
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /health
                        port: 12008
                      initialDelaySeconds: 5
                      periodSeconds: 5

        service:
          app:
            controller: metamcp
            ports:
              http:
                port: 12008
              backend:
                port: 12009

        persistence:
          kubeconfig:
            enabled: true
            type: secret
            name: metamcp
            items:
              - key: KUBECONFIG
                path: config
            advancedMounts:
              metamcp:
                app:
                  - path: /etc/kubeconfig
                    readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: metamcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: metamcp-db
  namespace: db
spec:
  name: metamcp
  owner: metamcp
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metamcp-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: metamcp-password

  data:
    - secretKey: username
      remoteRef:
        key: /metamcp/PG_USER
    - secretKey: password
      remoteRef:
        key: /metamcp/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metamcp
  namespace: metamcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: metamcp

  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: /metamcp/BETTER_AUTH_SECRET
    - secretKey: APP_URL
      remoteRef:
        key: /metamcp/APP_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: /metamcp/DATABASE_URL
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /metamcp/OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /metamcp/OIDC_CLIENT_SECRET
    - secretKey: OIDC_DISCOVERY_URL
      remoteRef:
        key: /metamcp/OIDC_DISCOVERY_URL
    - secretKey: OIDC_AUTHORIZATION_URL
      remoteRef:
        key: /metamcp/OIDC_AUTHORIZATION_URL
    - secretKey: OIDC_PROVIDER_ID
      remoteRef:
        key: /metamcp/OIDC_PROVIDER_ID
    - secretKey: OIDC_SCOPES
      remoteRef:
        key: /metamcp/OIDC_SCOPES
    - secretKey: OIDC_PKCE
      remoteRef:
        key: /metamcp/OIDC_PKCE
    - secretKey: KUBECONFIG_CONTEXT
      remoteRef:
        key: /metamcp/KUBECONFIG_CONTEXT
    - secretKey: KUBECONFIG
      remoteRef:
        key: /metamcp/KUBECONFIG
