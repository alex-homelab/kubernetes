apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperclipai
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default

  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      releaseName: paperclipai
      valuesObject:
        controllers:
          paperclipai:
            strategy: RollingUpdate
            containers:
              app:
                image:
                  repository: ghcr.io/paperclipai/paperclip
                  tag: latest
                  pullPolicy: IfNotPresent
                env:
                  PORT: "3100"
                  SERVE_UI: "true"
                  PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
                  PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
                  PAPERCLIP_TELEMETRY_DISABLED: "1"
                  DATABASE_URL:
                    valueFrom:
                      secretKeyRef:
                        name: paperclipai
                        key: DATABASE_URL
                  BETTER_AUTH_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: paperclipai
                        key: BETTER_AUTH_SECRET
                  PAPERCLIP_PUBLIC_URL:
                    valueFrom:
                      secretKeyRef:
                        name: paperclipai
                        key: PAPERCLIP_PUBLIC_URL
                  PAPERCLIP_API_URL:
                    valueFrom:
                      secretKeyRef:
                        name: paperclipai
                        key: PAPERCLIP_API_URL
        service:
          app:
            controller: paperclipai
            ports:
              http:
                port: 3100

        persistence:
          data:
            enabled: true
            type: emptyDir
            advancedMounts:
              paperclipai:
                app:
                  - path: /paperclip
                    readOnly: false

  destination:
    server: https://kubernetes.default.svc
    namespace: paperclipai

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: paperclipai-db
  namespace: db
spec:
  name: paperclipai
  owner: paperclipai
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclipai-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: paperclipai-password

  data:
    - secretKey: username
      remoteRef:
        key: /paperclipai/PG_USER
    - secretKey: password
      remoteRef:
        key: /paperclipai/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclipai
  namespace: paperclipai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: paperclipai

  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /paperclipai/DATABASE_URL
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: /paperclipai/BETTER_AUTH_SECRET
    - secretKey: PAPERCLIP_PUBLIC_URL
      remoteRef:
        key: /paperclipai/PAPERCLIP_PUBLIC_URL
    - secretKey: PAPERCLIP_API_URL
      remoteRef:
        key: /paperclipai/PAPERCLIP_API_URL
