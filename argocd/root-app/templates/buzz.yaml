apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buzz
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/block/buzz/charts
    chart: buzz
    targetRevision: 0.1.7
    helm:
      releaseName: buzz
      valuesObject:
        image:
          tag: sha-63496cc

        relayUrl: wss://buzz.vcov.org
        ownerPubkey: 4bf81603e5da3cbf754b8f9eb01e620bc46075a70c8ac75c7c8125ad130a5b3d
        replicaCount: 1

        secrets:
          existingSecret: buzz-relay-secret

        persistence:
          git:
            enabled: false
            size: 5Gi

        postgresql:
          enabled: false

        redis:
          enabled: true
          auth:
            existingSecret: buzz-relay-secret
            existingSecretPasswordKey: redis-password
          persistence:
            enabled: false

        s3:
          endpoint: http://minio.minio.svc.cluster.local:9000
          bucket: buzz-media

        ingress:
          enabled: false

        extraInitContainers:
          - name: ensure-bucket
            image: minio/mc:RELEASE.2025-08-13T08-35-41Z
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: buzz-relay-secret
                    key: BUZZ_S3_ACCESS_KEY
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: buzz-relay-secret
                    key: BUZZ_S3_SECRET_KEY
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -e
                export MC_CONFIG_DIR=/tmp/.mc
                until mc alias set local http://minio.minio.svc.cluster.local:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null 2>&1; do
                  echo "waiting for minio..."
                  sleep 2
                done
                mc mb --ignore-existing local/buzz-media
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: buzz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: buzz-db
  namespace: db
spec:
  name: buzz
  owner: buzz
  cluster:
    name: postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: buzz-password
  data:
    - secretKey: username
      remoteRef:
        key: /buzz/PG_USER
    - secretKey: password
      remoteRef:
        key: /buzz/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz
  namespace: buzz
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: buzz-relay-secret
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: postgres://{{ .PG_USER }}:{{ .PG_PASSWORD }}@postgres-rw.db.svc.cluster.local:5432/buzz?sslmode=disable
        REDIS_URL: redis://:{{ .REDIS_PASSWORD }}@buzz-redis:6379
        redis-password: '{{ .REDIS_PASSWORD }}'
  data:
    - secretKey: PG_USER
      remoteRef:
        key: /buzz/PG_USER
    - secretKey: PG_PASSWORD
      remoteRef:
        key: /buzz/PG_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /buzz/REDIS_PASSWORD
    - secretKey: BUZZ_RELAY_PRIVATE_KEY
      remoteRef:
        key: /buzz/BUZZ_RELAY_PRIVATE_KEY
    - secretKey: BUZZ_GIT_HOOK_HMAC_SECRET
      remoteRef:
        key: /buzz/BUZZ_GIT_HOOK_HMAC_SECRET
    - secretKey: BUZZ_S3_ACCESS_KEY
      remoteRef:
        key: /buzz/BUZZ_S3_ACCESS_KEY
    - secretKey: BUZZ_S3_SECRET_KEY
      remoteRef:
        key: /buzz/BUZZ_S3_SECRET_KEY
