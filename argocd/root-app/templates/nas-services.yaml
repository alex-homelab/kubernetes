apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nas-services
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      valuesObject:
        serviceAccount:
          default:
            enabled: true
        rbac:
          roles:
            manage-endpointslices:
              forceRename: manage-endpointslices
              type: Role
              rules:
                - apiGroups: ["discovery.k8s.io"]
                  resources: ["endpointslices"]
                  verbs: ["get", "list", "create", "update", "patch"]
          bindings:
            manage-endpointslices-binding:
              forceRename: allow-job-to-manage-endpointslices
              type: RoleBinding
              roleRef:
                identifier: manage-endpointslices
              subjects:
                - identifier: default
        controllers:
          endpoint-config:
            enabled: true
            type: job
            annotations:
              argocd.argoproj.io/hook: Sync
              argocd.argoproj.io/hook-delete-policy: HookSucceeded
            job:
              backoffLimit: 1
            serviceAccount:
              identifier: default
            containers:
              main:
                nameOverride: create-endpoint-slice
                image:
                  repository: alpine/kubectl
                  tag: 1.35.0
                command:
                  - /bin/sh
                  - -c
                  - |
                    cat <<'EOF' | kubectl apply -f -
                    apiVersion: discovery.k8s.io/v1
                    kind: EndpointSlice
                    metadata:
                      name: nas
                      namespace: nas-services
                      labels:
                        kubernetes.io/service-name: nas-services
                    addressType: IPv4
                    ports:
                      - name: jellyfin
                        protocol: TCP
                        port: 8097
                      - name: sonarr
                        protocol: TCP
                        port: 8989
                      - name: radarr
                        protocol: TCP
                        port: 7878
                      - name: prowlarr
                        protocol: TCP
                        port: 9696
                      - name: qb
                        protocol: TCP
                        port: 8181
                      - name: seerr
                        protocol: TCP
                        port: 5056
                      - name: nanollm
                        protocol: TCP
                        port: 3333
                    endpoints:
                      - conditions:
                          ready: true
                        addresses:
                        - 192.168.1.10
                    EOF
        service:
          nas:
            controller: endpoint-config
            ports:
              jellyfin: 
                port: 8097
              sonarr: 
                port: 8989
              radarr:
                port: 7878
              prowlarr:
                port: 9696
              qb:
                port: 8181
              seerr:
                port: 5056
              nanollm: 
                port: 3333
        route:
          jellyfin:
            enabled: true
            hostnames:
              - jellyfin.vcov.org
              - jellyfin.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 8097
          sonarr:
            enabled: true
            hostnames:
              - sonarr.vcov.org
              - sonarr.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 8989
          radarr:
            enabled: true
            hostnames:
              - radarr.vcov.org
              - radarr.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 7878
          prowlarr:
            enabled: true
            hostnames:
              - prowlarr.vcov.org
              - prowlarr.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 9696
          qb:
            enabled: true
            hostnames:
              - qb.vcov.org
              - qb.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 8181
          seerr:
            enabled: true
            hostnames:
              - seerr.vcov.org
              - seerr.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 5056
          openai:
            enabled: true
            hostnames:
              - api.openai.com
              - openai.lan
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            rules: 
            -  backendRefs:
                - name: nas-services
                  port: 3333
  destination:
    server: https://kubernetes.default.svc
    namespace: nas-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
