apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
spec:
  project: default

  source:
    repoURL: oci://8gears.container-registry.com/library/n8n
    chart: n8n
    targetRevision: 2.0.1
    helm:
      valuesObject:
        fullnameOverride: n8n
        image:
          tag: 2.11.2
        worker:
          enabled: true
          extraEnv:
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_ENCRYPTION_KEY
        main:
          config:
            n8n:
              hide_usage_page: true
          # secret:
          #   n8n:
          #     encryption_key: "<your-secure-encryption-key>"
          extraEnv:
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: NODE_ENV
              value: production
            - name: TZ
              value: Europe/Tallinn
            - name: DB_TYPE
              value: postgresdb
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_HOST
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_HOST
            - name: N8N_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_WEBHOOK_URL
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: N8N_ENCRYPTION_KEY
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_PORT
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: DB_POSTGRESDB_PASSWORD
          resources:
            limits:
              memory: 2048Mi
            requests:
              memory: 512Mi
        extraManifests:
          - apiVersion: postgresql.cnpg.io/v1
            kind: Database
            metadata:
              name: n8n-db
              namespace: db
            spec:
              name: n8n
              owner: n8n
              cluster:
                name: postgres
              extensions:
                - name: bloom
                  ensure: present
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: n8n-password
              namespace: db
            spec:
              secretStoreRef:
                kind: ClusterSecretStore
                name: infisical

              target:
                name: n8n-password

              data:
                - secretKey: username
                  remoteRef:
                    key: /n8n/PG_USER
                - secretKey: password
                  remoteRef:
                    key: /n8n/PG_PASSWORD
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: n8n-secrets
              namespace: n8n
            spec:
              secretStoreRef:
                kind: ClusterSecretStore
                name: infisical

              target:
                name: n8n

              data:
                - secretKey: N8N_HOST
                  remoteRef:
                    key: /n8n/N8N_HOST
                - secretKey: N8N_WEBHOOK_URL
                  remoteRef:
                    key: /n8n/N8N_WEBHOOK_URL
                - secretKey: N8N_ENCRYPTION_KEY
                  remoteRef:
                    key: /n8n/N8N_ENCRYPTION_KEY
                - secretKey: DB_POSTGRESDB_HOST
                  remoteRef:
                    key: /n8n/PG_HOST
                - secretKey: DB_POSTGRESDB_PORT
                  remoteRef:
                    key: /n8n/PG_PORT
                - secretKey: DB_POSTGRESDB_DATABASE
                  remoteRef:
                    key: /n8n/PG_DB
                - secretKey: DB_POSTGRESDB_USER
                  remoteRef:
                    key: /n8n/PG_USER
                - secretKey: DB_POSTGRESDB_PASSWORD
                  remoteRef:
                    key: /n8n/PG_PASSWORD
                
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true