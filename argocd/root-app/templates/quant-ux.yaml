apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quant-ux
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      releaseName: quant-ux
      valuesObject:
        controllers:
          frontend:
            containers:
              app:
                image:
                  repository: klausenschaefersinho/quant-ux
                  tag: latest@sha256:4ec6eeb63e822fa00b535484a6a454a9b5e50d069d691acbd76ff44a2c9966d3
                env:
                  QUX_PROXY_URL: http://quant-ux-backend:8080
                  QUX_AUTH: qux
                  QUX_WS_URL:
                    valueFrom:
                      secretKeyRef:
                        name: quant-ux
                        key: QUX_WS_URL
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 1Gi
                probes:
                  startup:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8082
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 30
                  readiness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8082
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
                  liveness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8082
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
          backend:
            strategy: Recreate
            containers:
              app:
                image:
                  repository: klausenschaefersinho/quant-ux-backend
                  tag: latest@sha256:5b4507acb2bdc2c81a908b87ec9d1f39ec0ca9977258bc339fe0ef5762b33864
                env:
                  QUX_HTTP_HOST:
                    valueFrom:
                      secretKeyRef:
                        name: quant-ux
                        key: QUX_HTTP_HOST
                  QUX_JWT_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: quant-ux
                        key: QUX_JWT_PASSWORD
                  QUX_HTTP_PORT: '8080'
                  QUX_MONGO_DB_NAME: quantux
                  QUX_MONGO_TABLE_PREFIX: quantux
                  QUX_MONGO_CONNECTION_STRING: mongodb://quant-ux-mongo:27017
                  QUX_IMAGE_FOLDER_USER: /app-data/qux-images
                  QUX_IMAGE_FOLDER_APPS: /app-data/qux-image-apps
                  QUX_AUTH_SERVICE: qux
                  QUX_USER_ALLOW_SIGNUP: 'true'
                  TZ: Europe/Tallinn
                resources:
                  requests:
                    cpu: 50m
                    memory: 256Mi
                  limits:
                    memory: 1Gi
                probes:
                  startup:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 30
                  readiness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
                  liveness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
          mongo:
            strategy: Recreate
            containers:
              app:
                image:
                  repository: mongo
                  tag: 7.0.16
                env: {}
                resources:
                  requests:
                    cpu: 50m
                    memory: 256Mi
                  limits:
                    memory: 1Gi
                probes:
                  startup:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 27017
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 30
                  readiness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 27017
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
                  liveness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 27017
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
          websocket:
            containers:
              app:
                image:
                  repository: klausenschaefersinho/quant-ux-websocket
                  tag: latest
                env:
                  QUX_SERVER: http://quant-ux-backend:8080/
                  QUX_SERVER_PORT: '8086'
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 1Gi
                probes:
                  startup:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8086
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 30
                  readiness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8086
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
                  liveness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8086
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
          proxy:
            containers:
              app:
                image:
                  repository: nginxinc/nginx-unprivileged
                  tag: 1.28-alpine
                env: {}
                resources:
                  requests:
                    cpu: 50m
                    memory: 32Mi
                  limits:
                    memory: 1Gi
                probes:
                  startup:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8088
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 30
                  readiness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8088
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
                  liveness:
                    enabled: true
                    type: TCP
                    spec:
                      tcpSocket:
                        port: 8088
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 3
        service:
          frontend:
            controller: frontend
            ports:
              http:
                port: 8082
          backend:
            controller: backend
            ports:
              http:
                port: 8080
          mongo:
            controller: mongo
            ports:
              mongo:
                port: 27017
          websocket:
            controller: websocket
            ports:
              http:
                port: 8086
          proxy:
            controller: proxy
            ports:
              http:
                port: 8088
        persistence:
          database:
            type: persistentVolumeClaim
            storageClass: longhorn
            accessMode: ReadWriteOnce
            size: 10Gi
            advancedMounts:
              mongo:
                app:
                - path: /data/db
          images:
            type: persistentVolumeClaim
            storageClass: longhorn
            accessMode: ReadWriteOnce
            size: 10Gi
            advancedMounts:
              backend:
                app:
                - path: /app-data
          proxy-config:
            type: configMap
            identifier: proxy
            advancedMounts:
              proxy:
                app:
                - path: /etc/nginx/conf.d/default.conf
                  subPath: default.conf
                  readOnly: true
        configMaps:
          proxy:
            data:
              default.conf: "server {\n  listen 8088;\n  client_max_body_size 50m;\n\
                \  location /ws {\n    proxy_pass http://quant-ux-websocket:8086;\n\
                \    proxy_http_version 1.1;\n    proxy_set_header Upgrade $http_upgrade;\n\
                \    proxy_set_header Connection \"upgrade\";\n    proxy_set_header\
                \ Host $host;\n    proxy_read_timeout 3600s;\n  }\n  location / {\n\
                \    proxy_pass http://quant-ux-frontend:8082;\n    proxy_set_header\
                \ Host $host;\n    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;\n\
                \    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
                \  }\n}\n"
  destination:
    server: https://kubernetes.default.svc
    namespace: quant-ux
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quant-ux
  namespace: quant-ux
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: quant-ux
  data:
  - secretKey: QUX_HTTP_HOST
    remoteRef:
      key: /quant-ux/QUX_HTTP_HOST
  - secretKey: QUX_WS_URL
    remoteRef:
      key: /quant-ux/QUX_WS_URL
  - secretKey: QUX_JWT_PASSWORD
    remoteRef:
      key: /quant-ux/QUX_JWT_PASSWORD

{{- range $service := list "quant-ux-backend" "quant-ux-frontend" "quant-ux-mongo" "quant-ux-proxy" "quant-ux-websocket" }}
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $service }}
  namespace: quant-ux
spec:
  networkRouterRef:
    name: home-k8s
    namespace: netbird
  serviceRef:
    name: {{ $service }}
  groups:
    - name: k8s-services
{{- end }}
