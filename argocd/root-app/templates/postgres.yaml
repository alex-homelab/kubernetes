apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.27.0
    helm:
      valuesObject:
        config:
          clusterWide: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw-lb
  namespace: db
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.165
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres
    cnpg.io/instanceRole: primary
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cluster
    targetRevision: 0.5.0
    helm:
      valuesObject:
        nameOverride: postgres
        cluster:
          instances: 2

          storage:
            size: 20Gi
            storageClass: local-path

          enableSuperuserAccess: true

          roles:
            - name: keycloak
              ensure: present
              login: true
              passwordSecret:
                name: keycloak-password
            - name: n8n
              ensure: present
              login: true
              passwordSecret:
                name: n8n-password
            - name: contextforge
              ensure: present
              login: true
              passwordSecret:
                name: context-forge-password
            - name: obot
              ensure: present
              login: true
              passwordSecret:
                name: obot-password
            - name: phoenix
              ensure: present
              login: true
              passwordSecret:
                name: phoenix-password
            - name: deploystack
              ensure: present
              login: true
              passwordSecret:
                name: deploystack-password
  destination:
    server: https://kubernetes.default.svc
    namespace: db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

{{- range $service := list "cnpg-webhook-service" }}
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $service }}
  namespace: cnpg-system
spec:
  networkRouterRef:
    name: home-k8s
    namespace: netbird
  serviceRef:
    name: {{ $service }}
  groups:
    - name: k8s-services
{{- end }}

{{- range $service := list "postgres-r" "postgres-ro" "postgres-rw" "postgres-rw-lb" }}
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $service }}
  namespace: db
spec:
  networkRouterRef:
    name: home-k8s
    namespace: netbird
  serviceRef:
    name: {{ $service }}
  groups:
    - name: k8s-services
{{- end }}
