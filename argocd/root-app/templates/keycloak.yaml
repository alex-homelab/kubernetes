apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/codecentric/helm-charts/keycloakx
    chart: keycloak
    targetRevision: 7.1.8
    helm:
      valuesObject:
        fullnameOverride: keycloak
        replicas: 2

        postgresql:
          enabled: false
        
        dbchecker:
          enabled: true
        
        database:
          vendor: postgres
          hostname: postgres-rw.db.svc.cluster.local
          port: 5432
          database: keycloak
          existingSecret: keycloak
          existingSecretKey: PG_PASSWORD

        ingress:
          enabled: true
          ingressClassName: traefik
          rules:
            - host: sso.lan
              paths:
                - path: /
                  pathType: Prefix
        
        command:
          - "/opt/keycloak/bin/kc.sh"
          - "start"
          - "--http-port=8080"
          - "--hostname-strict=false"
          - "--feature-workflows=enabled"

        proxy:
          enabled: true
          mode: xforwarded

        extraEnv: |
          - name: HOSTNAME_STRICT_HTTPS
            value: "true"
          - name: JAVA_OPTS
            value: >-
              -XX:MaxRAMPercentage=50.0
          - name: JAVA_OPTS_APPEND
            value: >-
              -Djgroups.dns.query=keycloak-headless
          - name: KC_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: keycloak
                key: PG_USER
          - name: KEYCLOAK_ADMIN
            valueFrom:
              secretKeyRef:
                name: keycloak
                key: KEYCLOAK_USER
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak
                key: KEYCLOAK_PASSWORD
        
        extraManifests:
          - |
            apiVersion: postgresql.cnpg.io/v1
            kind: Database
            metadata:
              name: keycloak-db
              namespace: db
            spec:
              name: keycloak
              owner: keycloak
              cluster:
                name: postgres
              extensions:
                - name: bloom
                  ensure: present
          - |
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: keycloak-password
              namespace: db
            spec:
              secretStoreRef:
                kind: ClusterSecretStore
                name: infisical

              target:
                name: keycloak-password

              data:
                - secretKey: username
                  remoteRef:
                    key: /keycloak/PG_USER

                - secretKey: password
                  remoteRef:
                    key: /keycloak/PG_PASSWORD
          - |
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: keycloak
              namespace: tooling
            spec:
              secretStoreRef:
                kind: ClusterSecretStore
                name: infisical

              target:
                name: keycloak

              data:
                - secretKey: PG_USER
                  remoteRef:
                    key: /keycloak/PG_USER
                - secretKey: PG_PASSWORD
                  remoteRef:
                    key: /keycloak/PG_PASSWORD
                - secretKey: KEYCLOAK_USER
                  remoteRef:
                    key: /keycloak/KEYCLOAK_USER
                - secretKey: KEYCLOAK_PASSWORD
                  remoteRef:
                    key: /keycloak/KEYCLOAK_PASSWORD
  destination:
    server: https://kubernetes.default.svc
    namespace: tooling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-internal-tls
  namespace: tooling
spec:
  secretName: keycloak-internal-tls
  dnsNames:
    - sso.vcov.org
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-internal-proxy
  namespace: tooling
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      access_log off;
      proxy_temp_path /tmp/proxy;
      client_body_temp_path /tmp/client;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      # Reload renewed certificates on new handshakes without a pod restart.
      map $ssl_server_name $tls_dir { default /etc/keycloak-tls; }
      server {
        listen 8443 ssl;
        server_name sso.vcov.org;
        ssl_certificate $tls_dir/tls.crt;
        ssl_certificate_key $tls_dir/tls.key;
        ssl_certificate_cache max=2 inactive=1m valid=1m;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://keycloak-http.tooling.svc.cluster.local;
          proxy_set_header Host sso.vcov.org;
          proxy_set_header X-Forwarded-Host sso.vcov.org;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Port 443;
          proxy_set_header Connection "";
          proxy_http_version 1.1;
        }
      }
      server {
        listen 8080;
        location = /healthz { return 200 "ok\n"; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-internal-proxy
  namespace: tooling
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-internal-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-internal-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: keycloak-internal-proxy
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/keycloak-proxy/nginx.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/keycloak-proxy
              readOnly: true
            - name: tls
              mountPath: /etc/keycloak-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: keycloak-internal-proxy
        - name: tls
          secret:
            secretName: keycloak-internal-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-internal-proxy
  namespace: tooling
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak-internal-proxy
  ports:
    - name: https
      port: 443
      targetPort: https

{{- range $service := list "keycloak-http" }}
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $service }}
  namespace: tooling
spec:
  networkRouterRef:
    name: home-k8s
    namespace: netbird
  serviceRef:
    name: {{ $service }}
  groups:
    - name: k8s-services
{{- end }}
