apiVersion: v1
kind: Namespace
metadata:
  name: obot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obot
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/obot-platform/obot.git
    targetRevision: v0.26.1
    path: chart
    helm:
      releaseName: obot
      valuesObject:
        replicaCount: 1
        fullnameOverride: obot
        image:
          repository: ghcr.io/obot-platform/obot
          tag: v0.26.1
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: false
        secret:
          existingSecret: obot
        tunnelPeer:
          existingSecret: obot
        config:
          OBOT_SERVER_HOSTNAME: https://obot.vcov.org
          OBOT_SERVER_ENABLE_AUTHENTICATION: false
          OBOT_ENABLE_AGENTS: "true"
          OBOT_SERVER_ENCRYPTION_PROVIDER: custom
          OBOT_SERVER_ENCRYPTION_CONFIG_FILE: /config/encryption.yaml
          OBOT_SERVER_MCPRUNTIME_BACKEND: kubernetes
          OBOT_SERVER_MCPNAMESPACE: obot-mcp
        mcpNamespace:
          name: obot-mcp
          networkPolicy:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: obot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: obot-db
  namespace: db
spec:
  name: obot
  owner: obot
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obot-password
  data:
    - secretKey: username
      remoteRef:
        key: /obot/PG_USER
    - secretKey: password
      remoteRef:
        key: /obot/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot
  namespace: obot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obot
  data:
    - secretKey: OBOT_SERVER_DSN
      remoteRef:
        key: /obot/OBOT_SERVER_DSN
    - secretKey: OBOT_BOOTSTRAP_TOKEN
      remoteRef:
        key: /obot/OBOT_BOOTSTRAP_TOKEN
    - secretKey: OBOT_SERVER_ENCRYPTION_KEY
      remoteRef:
        key: /obot/OBOT_SERVER_ENCRYPTION_KEY
    - secretKey: OBOT_SERVER_TUNNEL_PEER_TOKEN
      remoteRef:
        key: /obot/OBOT_SERVER_TUNNEL_PEER_TOKEN
