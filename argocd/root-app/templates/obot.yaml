apiVersion: v1
kind: Namespace
metadata:
  name: obot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obot
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/obot-platform/obot.git
    targetRevision: v0.23.3
    path: chart
    helm:
      releaseName: obot
      valuesObject:
        fullnameOverride: obot
        image:
          repository: ghcr.io/obot-platform/obot
          tag: v0.23.3
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: false
        persistence:
          enabled: false
        config:
          existingSecret: obot
          OBOT_SERVER_MCPRUNTIME_BACKEND: kubernetes
        mcpNamespace:
          name: obot-mcp
          networkPolicy:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: obot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: obot-db
  namespace: db
spec:
  name: obot
  owner: obot
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obot-password
  data:
    - secretKey: username
      remoteRef:
        key: /obot/PG_USER
    - secretKey: password
      remoteRef:
        key: /obot/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot
  namespace: obot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obot
  data:
    - secretKey: OBOT_SERVER_DSN
      remoteRef:
        key: /obot/OBOT_SERVER_DSN
    - secretKey: OBOT_BOOTSTRAP_TOKEN
      remoteRef:
        key: /obot/OBOT_BOOTSTRAP_TOKEN
    - secretKey: OBOT_SERVER_ENCRYPTION_PROVIDER
      remoteRef:
        key: /obot/OBOT_SERVER_ENCRYPTION_PROVIDER
    - secretKey: OBOT_SERVER_ENCRYPTION_KEY
      remoteRef:
        key: /obot/OBOT_SERVER_ENCRYPTION_KEY
    - secretKey: OBOT_SERVER_ENCRYPTION_CONFIG_FILE
      remoteRef:
        key: /obot/OBOT_SERVER_ENCRYPTION_CONFIG_FILE
    - secretKey: OBOT_SERVER_ENABLE_AUTHENTICATION
      remoteRef:
        key: /obot/OBOT_SERVER_ENABLE_AUTHENTICATION
    - secretKey: OBOT_SERVER_ENABLE_REGISTRY_AUTH
      remoteRef:
        key: /obot/OBOT_SERVER_ENABLE_REGISTRY_AUTH
    - secretKey: OBOT_SERVER_AUDIT_LOGS_MODE
      remoteRef:
        key: /obot/OBOT_SERVER_AUDIT_LOGS_MODE
    - secretKey: OBOT_SERVER_MCPRUNTIME_BACKEND
      remoteRef:
        key: /obot/OBOT_SERVER_MCPRUNTIME_BACKEND
    - secretKey: OBOT_SERVER_MCPNAMESPACE
      remoteRef:
        key: /obot/OBOT_SERVER_MCPNAMESPACE
    - secretKey: OBOT_SERVER_SERVICE_NAME
      remoteRef:
        key: /obot/OBOT_SERVER_SERVICE_NAME
    - secretKey: OBOT_SERVER_SERVICE_NAMESPACE
      remoteRef:
        key: /obot/OBOT_SERVER_SERVICE_NAMESPACE
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_ENABLED
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_ENABLED
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_ENFORCE
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_ENFORCE
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_ENFORCE_VERSION
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_ENFORCE_VERSION
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_AUDIT
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_AUDIT
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_AUDIT_VERSION
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_AUDIT_VERSION
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_WARN
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_WARN
    - secretKey: OBOT_SERVER_MCPPOD_SECURITY_WARN_VERSION
      remoteRef:
        key: /obot/OBOT_SERVER_MCPPOD_SECURITY_WARN_VERSION
    - secretKey: NAH_THREADINESS
      remoteRef:
        key: /obot/NAH_THREADINESS
    - secretKey: KINM_DB_CONNECTIONS
      remoteRef:
        key: /obot/KINM_DB_CONNECTIONS
