apiVersion: v1
kind: Namespace
metadata:
  name: obot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obot
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/obot-platform/obot.git
    targetRevision: v0.26.3
    path: chart
    helm:
      releaseName: obot
      valuesObject:
        replicaCount: 1
        fullnameOverride: obot
        image:
          repository: ghcr.io/obot-platform/obot
          tag: v0.26.3
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: false
        secret:
          existingSecret: obot
        tunnelPeer:
          existingSecret: obot
        extraVolumes:
          - name: custom-ca
            configMap:
              name: obot-ca
          - name: hosts
            configMap:
              name: obot-hosts
        extraVolumeMounts:
          - name: custom-ca
            mountPath: /etc/ssl/certs/infisical-ca.pem
            subPath: ca.crt
            readOnly: true
          - name: hosts
            mountPath: /etc/hosts
            subPath: hosts
            readOnly: true
        config:
          OBOT_SERVER_HOSTNAME: https://obot.vcov.org
          OBOT_SERVER_ENABLE_AUTHENTICATION: true
          OBOT_SERVER_ENABLE_HOSTED_AGENTS: true
          OBOT_SERVER_HOSTED_AGENTS_STORAGE_CLASS_NAME: local-path
          OBOT_ENABLE_AGENTS: "true"
          OBOT_SERVER_ENCRYPTION_PROVIDER: custom
          OBOT_SERVER_ENCRYPTION_CONFIG_FILE: /config/encryption.yaml
          OBOT_SERVER_MCPRUNTIME_BACKEND: kubernetes
          OBOT_SERVER_MCPNAMESPACE: obot-mcp
        mcpNamespace:
          name: obot-mcp
          networkPolicy:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: obot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
