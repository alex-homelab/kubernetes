apiVersion: v1
kind: ConfigMap
metadata:
  name: obot-hosts
  namespace: obot
data:
  hosts: |
    127.0.0.1 localhost
    ::1 localhost ip6-localhost ip6-loopback
    fe00::0 ip6-localnet
    fe00::0 ip6-mcastprefix
    fe00::1 ip6-allnodes
    fe00::2 ip6-allrouters
    192.168.1.160 api.openai.com
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: obot-db
  namespace: db
spec:
  name: obot
  owner: obot
  cluster:
    name: postgres
  extensions:
    - name: bloom
      ensure: present
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obot-password
  data:
    - secretKey: username
      remoteRef:
        key: /obot/PG_USER
    - secretKey: password
      remoteRef:
        key: /obot/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot
  namespace: obot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: obot
  data:
    - secretKey: OBOT_SERVER_DSN
      remoteRef:
        key: /obot/OBOT_SERVER_DSN
    - secretKey: OBOT_BOOTSTRAP_TOKEN
      remoteRef:
        key: /obot/OBOT_BOOTSTRAP_TOKEN
    - secretKey: OBOT_SERVER_ENCRYPTION_KEY
      remoteRef:
        key: /obot/OBOT_SERVER_ENCRYPTION_KEY
    - secretKey: OBOT_SERVER_TUNNEL_PEER_TOKEN
      remoteRef:
        key: /obot/OBOT_SERVER_TUNNEL_PEER_TOKEN
    - secretKey: OBOT_ARTIFACT_STORAGE_PROVIDER
      remoteRef:
        key: /obot/OBOT_ARTIFACT_STORAGE_PROVIDER
    - secretKey: OBOT_ARTIFACT_STORAGE_BUCKET
      remoteRef:
        key: /obot/OBOT_ARTIFACT_STORAGE_BUCKET
    - secretKey: OBOT_ARTIFACT_S3_ENDPOINT
      remoteRef:
        key: /obot/OBOT_ARTIFACT_S3_ENDPOINT
    - secretKey: OBOT_ARTIFACT_S3_REGION
      remoteRef:
        key: /obot/OBOT_ARTIFACT_S3_REGION
    - secretKey: OBOT_ARTIFACT_S3_ACCESS_KEY_ID
      remoteRef:
        key: /obot/OBOT_ARTIFACT_S3_ACCESS_KEY_ID
    - secretKey: OBOT_ARTIFACT_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: /obot/OBOT_ARTIFACT_S3_SECRET_ACCESS_KEY
