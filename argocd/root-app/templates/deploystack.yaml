apiVersion: v1
kind: Namespace
metadata:
  name: deploystack
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploystack
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      releaseName: deploystack
      valuesObject:
        controllers:
          backend:
            strategy: RollingUpdate
            containers:
              app:
                image:
                  repository: deploystack/backend
                  tag: latest
                  pullPolicy: IfNotPresent
                env:
                  NODE_ENV: production
                  PORT: "3000"
                  DEPLOYSTACK_FRONTEND_URL: https://deploystack.vcov.org
                  DEPLOYSTACK_ENCRYPTION_SECRET:
                    valueFrom:
                      secretKeyRef:
                        name: deploystack
                        key: DEPLOYSTACK_ENCRYPTION_SECRET
                  POSTGRES_HOST: postgres-rw.db.svc.cluster.local
                  POSTGRES_PORT: "5432"
                  POSTGRES_DATABASE: deploystack
                  POSTGRES_USER: deploystack
                  POSTGRES_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: deploystack
                        key: PG_PASSWORD
                  POSTGRES_SSL: "false"
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 3000
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                  startup:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 3000
                      failureThreshold: 60
                      periodSeconds: 10
                      timeoutSeconds: 5
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 1Gi
          frontend:
            strategy: RollingUpdate
            containers:
              app:
                image:
                  repository: deploystack/frontend
                  tag: latest
                  pullPolicy: IfNotPresent
                env:
                  VITE_DEPLOYSTACK_BACKEND_URL: https://deploystack.vcov.org
                  VITE_APP_TITLE: DeployStack
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 5
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 256Mi

        service:
          backend:
            controller: backend
            ports:
              http:
                port: 3000
          frontend:
            controller: frontend
            ports:
              http:
                port: 80

        route:
          app:
            enabled: true
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
            hostnames:
              - deploystack.vcov.org
              - deploystack.lan
            rules:
              - matches:
                - path:
                    type: PathPrefix
                    value: /api
                backendRefs:
                - name: deploystack-backend
                  port: 3000
              - matches:
                - path:
                    type: PathPrefix
                    value: /
                backendRefs:
                - name: deploystack-frontend
                  port: 80

        persistence:
          backend-data:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 10Gi
            storageClass: local-path
            advancedMounts:
              backend:
                app:
                  - path: /app/persistent_data
                    readOnly: false
  destination:
    server: https://kubernetes.default.svc
    namespace: deploystack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: deploystack-db
  namespace: db
spec:
  name: deploystack
  owner: deploystack
  cluster:
    name: postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deploystack-password
  namespace: db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: deploystack-password
  data:
    - secretKey: username
      remoteRef:
        key: /deploystack/PG_USER
    - secretKey: password
      remoteRef:
        key: /deploystack/PG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deploystack
  namespace: deploystack
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: deploystack
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: /deploystack/PG_PASSWORD
    - secretKey: DEPLOYSTACK_ENCRYPTION_SECRET
      remoteRef:
        key: /deploystack/DEPLOYSTACK_ENCRYPTION_SECRET
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deploystack-proxy
  namespace: deploystack
data:
  nginx.conf: |
    server {
      listen 80;
      server_name _;

      location /api/ {
        proxy_pass http://deploystack-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
      }

      location / {
        proxy_pass http://deploystack-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploystack-proxy
  namespace: deploystack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deploystack-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deploystack-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: deploystack-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: deploystack-proxy
  namespace: deploystack
spec:
  selector:
    app.kubernetes.io/name: deploystack-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
