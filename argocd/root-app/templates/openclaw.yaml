apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
spec:
  project: default

  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2
    helm:
      releaseName: openclaw
      valuesObject:
        controllers:
          openclaw:
            strategy: RollingUpdate
            initContainers:
              git-askpass-init:
                image:
                  repository: busybox
                  tag: "1.36"
                  pullPolicy: IfNotPresent
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -eu
                    cat > /work/git-askpass.sh <<'EOF'
                    #!/bin/sh
                    case "$1" in
                      *Username*github.com*) echo "${GITHUB_USERNAME:-x-access-token}" ;;
                      *Password*github.com*) echo "${GITHUB_TOKEN}" ;;
                      *Username*bitbucket.org*) echo "${BITBUCKET_USERNAME}" ;;
                      *Password*bitbucket.org*) echo "${BITBUCKET_APP_PASSWORD}" ;;
                      *) echo "" ;;
                    esac
                    EOF
                    chmod 0700 /work/git-askpass.sh
                # envFrom:
                #   - secretRef:
                #       name: openclaw-secrets
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true

            containers:
              app:
                image:
                  repository: ghcr.io/openclaw/openclaw
                  tag: latest
                  pullPolicy: IfNotPresent

                probes:
                  liveness:
                    enabled: true
                  readiness:
                    enabled: true

                env:
                  TZ: Europe/Tallinn
                  GIT_TERMINAL_PROMPT: "0"
                  GIT_ASKPASS: /opt/git-askpass/git-askpass.sh

                envFrom:
                  - secretRef:
                      name: openclaw-secrets

                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: false
                  capabilities:
                    drop: ["ALL"]

                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: 1000m
                    memory: 2Gi

        service:
          app:
            controller: openclaw
            ports:
              http:
                port: 18789

        persistence:
          askpass:
            enabled: true
            type: emptyDir
            advancedMounts:
              openclaw:
                git-askpass-init:
                  - path: /work
                    readOnly: false
                app:
                  - path: /opt/git-askpass
                    readOnly: true
          data:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 10Gi
            storageClass: longhorn
            advancedMounts:
              openclaw:
                app:
                  - path: /data
                    readOnly: false

        serviceAccount:
          default:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: openclaw-secrets
    namespace: openclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: openclaw-secrets
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: /openclaw/GITHUB_TOKEN

    - secretKey: GITHUB_USERNAME
      remoteRef:
        key: /openclaw/GITHUB_USERNAME

    - secretKey: BITBUCKET_USERNAME
      remoteRef:
        key: /openclaw/BITBUCKET_USERNAME

    - secretKey: BITBUCKET_APP_PASSWORD
      remoteRef:
        key: /openclaw/BITBUCKET_APP_PASSWORD