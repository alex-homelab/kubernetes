apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    chart: argo-workflows
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 0.47.3
    helm:
      valuesObject:
        crds:
          full: true
        workflow:
          serviceAccount:
            create: true
            name: "argo-workflow"
          rbac:
            create: true
        controller:
          workflowNamespaces:
            - tooling
        server:
          httproute:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io	
                kind: Gateway
                name: traefik-gateway
                namespace: traefik
                sectionName: websecure
            hostnames:
              - workflows.lan
        extraObjects:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: sam
              namespace: tooling
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: sam-argo-workflows-admin
              namespace: tooling
            subjects:
              - kind: ServiceAccount
                name: sam
                namespace: tooling
            roleRef:
              kind: ClusterRole
              name: argo-workflows-admin

  destination:
    server: https://kubernetes.default.svc
    namespace: tooling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true