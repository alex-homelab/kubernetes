apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/alex-homelab/kubernetes.git
    path: argocd
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-oidc-selfsigned
  namespace: argocd
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-oidc-ca
  namespace: argocd
spec:
  isCA: true
  commonName: ArgoCD internal OIDC CA
  secretName: argocd-oidc-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: argocd-oidc-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-oidc-ca
  namespace: argocd
spec:
  ca:
    secretName: argocd-oidc-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-oidc-tls
  namespace: argocd
spec:
  secretName: argocd-oidc-tls
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: argocd
  dnsNames:
    - sso.vcov.org
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: argocd-oidc-ca
    kind: Issuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-oidc-proxy
  namespace: argocd
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      proxy_temp_path /tmp/proxy;
      client_body_temp_path /tmp/client;
      # Variable certificate paths allow renewal without restarting ArgoCD.
      map $ssl_server_name $tls_dir { default /etc/oidc-tls; }
      server {
        listen 127.0.0.1:443 ssl;
        server_name sso.vcov.org;
        ssl_certificate $tls_dir/tls.crt;
        ssl_certificate_key $tls_dir/tls.key;
        ssl_certificate_cache max=2 inactive=1m valid=1m;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://keycloak-http.tooling.svc.cluster.local;
          proxy_set_header Host sso.vcov.org;
          proxy_set_header X-Forwarded-Host sso.vcov.org;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Port 443;
          proxy_set_header Connection "";
          proxy_http_version 1.1;
        }
      }
      server {
        listen 127.0.0.1:8085;
        location = /healthz { return 200 "ok\n"; }
      }
    }

{{- range $service := list "argo-cd-argocd-applicationset-controller" "argo-cd-argocd-dex-server" "argo-cd-argocd-redis" "argo-cd-argocd-repo-server" "argo-cd-argocd-server" }}
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $service }}
  namespace: argocd
spec:
  networkRouterRef:
    name: home-k8s
    namespace: netbird
  serviceRef:
    name: {{ $service }}
  groups:
    - name: k8s-services
{{- end }}
