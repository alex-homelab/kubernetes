apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/alex-homelab/kubernetes.git
    path: argocd
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

{{- range $service := list "argo-cd-argocd-applicationset-controller" "argo-cd-argocd-dex-server" "argo-cd-argocd-redis" "argo-cd-argocd-repo-server" "argo-cd-argocd-server" }}
---
apiVersion: netbird.io/v1alpha1
kind: NetworkResource
metadata:
  name: {{ $service }}
  namespace: argocd
spec:
  networkRouterRef:
    name: home-k8s
    namespace: netbird
  serviceRef:
    name: {{ $service }}
  groups:
    - name: k8s-services
{{- end }}
